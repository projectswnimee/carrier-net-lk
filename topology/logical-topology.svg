<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">CarrierNet-LK logical topology</title>
  <desc id="desc">Two FRRouting provider edge routers, two FRRouting core routers, four MikroTik customer edge routers and four VPCS endpoints form two isolated MPLS Layer 3 VPNs.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <style>
      .title{font:700 30px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.subtitle{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#475569}
      .nodeTitle{font:700 16px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.nodeSub{font:500 12px 'Segoe UI',Arial,sans-serif;fill:#334155}
      .edge{fill:none;stroke:#475569;stroke-width:4;stroke-linecap:round}.core{stroke:#2563eb;stroke-width:6}.custA{stroke:#16a34a}.custB{stroke:#7c3aed}
      .label{font:600 11px 'Segoe UI',Arial,sans-serif;fill:#334155}.small{font:500 11px 'Segoe UI',Arial,sans-serif;fill:#64748b}
    </style>
  </defs>

  <rect width="1440" height="820" fill="#f8fafc"/>
  <text x="720" y="44" text-anchor="middle" class="title">CarrierNet-LK - IP/MPLS L3VPN</text>
  <text x="720" y="70" text-anchor="middle" class="subtitle">GNS3 lab - FRRouting provider core - MikroTik customer edges - Provider AS65000</text>

  <rect x="25" y="95" width="1390" height="190" rx="22" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <text x="48" y="123" class="label">CUSTOMER A - AS65100 - RT 65000:100</text>
  <rect x="25" y="600" width="1390" height="190" rx="22" fill="#faf5ff" stroke="#e9d5ff" stroke-width="2"/>
  <text x="48" y="628" class="label">CUSTOMER B - AS65200 - RT 65000:200</text>
  <rect x="400" y="150" width="640" height="520" rx="30" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="720" y="178" text-anchor="middle" class="label">PROVIDER CORE - IS-IS LEVEL 2 - MPLS/LDP - MP-BGP VPN</text>

  <!-- Customer access links -->
  <path d="M170 203 H250" class="edge custA"/><path d="M380 203 L465 340" class="edge custA"/>
  <path d="M975 340 L1060 203" class="edge custA"/><path d="M1190 203 H1270" class="edge custA"/>
  <path d="M170 688 H250" class="edge custB"/><path d="M380 688 L465 470" class="edge custB"/>
  <path d="M975 470 L1060 688" class="edge custB"/><path d="M1190 688 H1270" class="edge custB"/>

  <!-- Provider links: PE1-P1-P2-PE2 plus cross links -->
  <path d="M595 367 L662 262" class="edge core"/>
  <path d="M720 280 V520" class="edge core"/>
  <path d="M778 538 L845 447" class="edge core"/>
  <path d="M595 443 L662 538" class="edge core"/>
  <path d="M778 262 L845 367" class="edge core"/>

  <g class="small">
    <text x="596" y="292">10.0.0.0/31</text><text x="728" y="397">10.0.0.2/31</text>
    <text x="815" y="502">10.0.0.4/31</text><text x="586" y="516">10.0.0.6/31</text>
    <text x="812" y="292">10.0.0.8/31</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="45" y="165" width="125" height="76" rx="14" fill="white" stroke="#16a34a" stroke-width="3"/>
    <text x="108" y="194" text-anchor="middle" class="nodeTitle">PC-A1</text><text x="108" y="218" text-anchor="middle" class="nodeSub">10.10.10.10/24</text>
    <rect x="250" y="160" width="130" height="86" rx="15" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="315" y="190" text-anchor="middle" class="nodeTitle">CE-A1</text><text x="315" y="214" text-anchor="middle" class="nodeSub">CHR - 172.16.1.2</text><text x="315" y="232" text-anchor="middle" class="small">AS65100</text>

    <rect x="465" y="340" width="130" height="110" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <text x="530" y="376" text-anchor="middle" class="nodeTitle">PE1</text><text x="530" y="402" text-anchor="middle" class="nodeSub">10.255.0.1/32</text><text x="530" y="426" text-anchor="middle" class="small">FRR - CUST-A/B</text>
    <rect x="662" y="205" width="116" height="75" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="720" y="234" text-anchor="middle" class="nodeTitle">P1</text><text x="720" y="258" text-anchor="middle" class="nodeSub">10.255.0.2/32</text>
    <rect x="662" y="520" width="116" height="75" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="720" y="549" text-anchor="middle" class="nodeTitle">P2</text><text x="720" y="573" text-anchor="middle" class="nodeSub">10.255.0.3/32</text>
    <rect x="845" y="340" width="130" height="110" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <text x="910" y="376" text-anchor="middle" class="nodeTitle">PE2</text><text x="910" y="402" text-anchor="middle" class="nodeSub">10.255.0.4/32</text><text x="910" y="426" text-anchor="middle" class="small">FRR - CUST-A/B</text>

    <rect x="1060" y="160" width="130" height="86" rx="15" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="1125" y="190" text-anchor="middle" class="nodeTitle">CE-A2</text><text x="1125" y="214" text-anchor="middle" class="nodeSub">CHR - 172.16.2.2</text><text x="1125" y="232" text-anchor="middle" class="small">AS65100</text>
    <rect x="1270" y="165" width="125" height="76" rx="14" fill="white" stroke="#16a34a" stroke-width="3"/>
    <text x="1332" y="194" text-anchor="middle" class="nodeTitle">PC-A2</text><text x="1332" y="218" text-anchor="middle" class="nodeSub">10.10.20.10/24</text>

    <rect x="45" y="650" width="125" height="76" rx="14" fill="white" stroke="#7c3aed" stroke-width="3"/>
    <text x="108" y="679" text-anchor="middle" class="nodeTitle">PC-B1</text><text x="108" y="703" text-anchor="middle" class="nodeSub">10.10.10.10/24</text>
    <rect x="250" y="645" width="130" height="86" rx="15" fill="#f3e8ff" stroke="#7c3aed" stroke-width="3"/>
    <text x="315" y="675" text-anchor="middle" class="nodeTitle">CE-B1</text><text x="315" y="699" text-anchor="middle" class="nodeSub">CHR - 172.17.1.2</text><text x="315" y="717" text-anchor="middle" class="small">AS65200</text>
    <rect x="1060" y="645" width="130" height="86" rx="15" fill="#f3e8ff" stroke="#7c3aed" stroke-width="3"/>
    <text x="1125" y="675" text-anchor="middle" class="nodeTitle">CE-B2</text><text x="1125" y="699" text-anchor="middle" class="nodeSub">CHR - 172.17.2.2</text><text x="1125" y="717" text-anchor="middle" class="small">AS65200</text>
    <rect x="1270" y="650" width="125" height="76" rx="14" fill="white" stroke="#7c3aed" stroke-width="3"/>
    <text x="1332" y="679" text-anchor="middle" class="nodeTitle">PC-B2</text><text x="1332" y="703" text-anchor="middle" class="nodeSub">10.10.20.10/24</text>
  </g>

  <text x="720" y="775" text-anchor="middle" class="small">Overlapping customer LANs remain isolated by VRFs and route targets</text>
</svg>
