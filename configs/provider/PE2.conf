frr version 10.3
frr defaults traditional
hostname PE2
log syslog informational
service integrated-vtysh-config
!
vrf CUST-A
exit-vrf
!
vrf CUST-B
exit-vrf
!
interface eth0
 ip address 10.0.0.5/31
 ip router isis CORE
 isis network point-to-point
exit
!
interface eth1
 ip address 10.0.0.9/31
 ip router isis CORE
 isis network point-to-point
exit
!
interface eth2 vrf CUST-A
 ip address 172.16.2.1/30
exit
!
interface eth3 vrf CUST-B
 ip address 172.17.2.1/30
exit
!
interface lo
 ip address 10.255.0.4/32
 ip router isis CORE
exit
!
router isis CORE
 net 49.0001.0000.0000.0004.00
 is-type level-2-only
exit
!
mpls ldp
 router-id 10.255.0.4
 address-family ipv4
  discovery transport-address 10.255.0.4
  interface eth0
  interface eth1
 exit-address-family
exit
!
route-map CE-PERMIT permit 10
exit
!
router bgp 65000
 bgp router-id 10.255.0.4
 neighbor 10.255.0.1 remote-as 65000
 neighbor 10.255.0.1 update-source lo
 address-family ipv4 vpn
  neighbor 10.255.0.1 activate
 exit-address-family
exit
!
router bgp 65000 vrf CUST-A
 bgp router-id 10.255.0.4
 neighbor 172.16.2.2 remote-as 65100
 address-family ipv4 unicast
  neighbor 172.16.2.2 activate
  neighbor 172.16.2.2 route-map CE-PERMIT in
  neighbor 172.16.2.2 route-map CE-PERMIT out
  neighbor 172.16.2.2 as-override
  rd vpn export 65000:102
  rt vpn both 65000:100
  label vpn export auto
  import vpn
  export vpn
 exit-address-family
exit
!
router bgp 65000 vrf CUST-B
 bgp router-id 10.255.0.4
 neighbor 172.17.2.2 remote-as 65200
 address-family ipv4 unicast
  neighbor 172.17.2.2 activate
  neighbor 172.17.2.2 route-map CE-PERMIT in
  neighbor 172.17.2.2 route-map CE-PERMIT out
  neighbor 172.17.2.2 as-override
  rd vpn export 65000:202
  rt vpn both 65000:200
  label vpn export auto
  import vpn
  export vpn
 exit-address-family
exit
!
end
