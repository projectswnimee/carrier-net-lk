frr version 10.3
frr defaults traditional
hostname P2
log syslog informational
service integrated-vtysh-config
!
interface eth0
 ip address 10.0.0.3/31
 ip router isis CORE
 isis network point-to-point
exit
!
interface eth1
 ip address 10.0.0.4/31
 ip router isis CORE
 isis network point-to-point
exit
!
interface eth2
 ip address 10.0.0.7/31
 ip router isis CORE
 isis network point-to-point
exit
!
interface lo
 ip address 10.255.0.3/32
 ip router isis CORE
exit
!
router isis CORE
 net 49.0001.0000.0000.0003.00
 is-type level-2-only
exit
!
mpls ldp
 router-id 10.255.0.3
 address-family ipv4
  discovery transport-address 10.255.0.3
  interface eth0
  interface eth1
  interface eth2
 exit-address-family
exit
!
end
